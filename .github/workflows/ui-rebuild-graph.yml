name: UI Rebuild LangGraph

on:
  push:
    paths:
      - 'graphs/ui-rebuild/**'
      - 'docs/ui/**'
      - '.github/workflows/ui-rebuild-graph.yml'
  pull_request:
    paths:
      - 'graphs/ui-rebuild/**'
      - 'docs/ui/**'
      - '.github/workflows/ui-rebuild-graph.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphs/ui-rebuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: graphs/ui-rebuild/pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest
